<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6B8D7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#D8BFD8;stop-opacity:0.3" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#f5f5f5"/>

  <!-- Gradient background -->
  <rect width="400" height="400" fill="url(#grad)"/>

  <!-- Central diamond/gem shape -->
  <g transform="translate(200, 150)">
    <!-- Outer frame -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#E6B8D7" stroke-width="2"/>

    <!-- Inner gem shape -->
    <polygon points="0,-60 50,20 0,70 -50,20" fill="#D8BFD8" opacity="0.7" filter="url(#shadow)"/>

    <!-- Highlight -->
    <ellipse cx="-20" cy="-20" rx="25" ry="30" fill="white" opacity="0.4"/>
  </g>

  <!-- Category label -->
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
        text-anchor="middle" fill="#E6B8D7">
    FINE PENDANTS
  </text>

  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="8" fill="#E6B8D7" opacity="0.4"/>
  <circle cx="350" cy="350" r="8" fill="#D8BFD8" opacity="0.4"/>
  <circle cx="350" cy="50" r="6" fill="#D8BFD8" opacity="0.3"/>
  <circle cx="50" cy="350" r="6" fill="#E6B8D7" opacity="0.3"/>

  <!-- Watermark -->
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="12"
        text-anchor="middle" fill="#ccc" opacity="0.6">
    Anaswara Jewelers
  </text>
</svg>
