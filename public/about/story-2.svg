<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:0.1" />
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="#fafaf8"/>
  <rect width="600" height="400" fill="url(#grad2)"/>

  <!-- Jewelry display with multiple items -->
  <g transform="translate(300, 200)">
    <!-- Ring -->
    <circle cx="-120" cy="-60" r="35" fill="none" stroke="#D4AF37" stroke-width="8"/>
    <circle cx="-120" cy="-60" r="45" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.3"/>

    <!-- Necklace -->
    <path d="M -60,-80 Q 0,-120 60,-80" fill="none" stroke="#C0C0C0" stroke-width="6"/>
    <circle cx="0" cy="-100" r="12" fill="#E6B8D7"/>

    <!-- Bracelet -->
    <circle cx="-100" cy="80" r="50" fill="none" stroke="#FFD700" stroke-width="6"/>

    <!-- Earrings -->
    <circle cx="100" cy="-40" r="20" fill="#FFB6C1" opacity="0.8"/>
    <circle cx="100" cy="20" r="15" fill="#FFB6C1" opacity="0.6"/>
  </g>

  <text x="300" y="350" font-family="serif" font-size="24" font-weight="bold"
        text-anchor="middle" fill="#8B7355">
    CRAFTED WITH CARE
  </text>
</svg>
