<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#C0C0C0;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="#f9f5ed"/>
  <rect width="600" height="400" fill="url(#grad1)"/>

  <!-- Decorative jewelry illustration -->
  <g transform="translate(300, 200)">
    <!-- Central gem -->
    <polygon points="0,-80 60,40 0,100 -60,40" fill="#D4AF37" opacity="0.8"/>
    <ellipse cx="-20" cy="-40" rx="30" ry="40" fill="white" opacity="0.3"/>

    <!-- Side gems -->
    <circle cx="-150" cy="0" r="40" fill="#E6B8D7" opacity="0.6"/>
    <circle cx="150" cy="0" r="40" fill="#FFD700" opacity="0.6"/>

    <!-- Connecting lines -->
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#C0C0C0" stroke-width="2" opacity="0.5"/>
  </g>

  <text x="300" y="350" font-family="serif" font-size="24" font-weight="bold"
        text-anchor="middle" fill="#8B7355">
    TRADITION & TRUST
  </text>
</svg>
